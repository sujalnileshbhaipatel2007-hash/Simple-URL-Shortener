<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple URL Shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="scanline"></div>

<header class="topbar">
  <div class="wrap topbar-inner topbar-inner--single">
    <div class="status" id="mongoStatus"><span class="dot"></span><span class="status-text">checking backend…</span></div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>Simple URL Shortener</h1>
    <p class="sub">Paste a link that you want to short</p>
  </section>

  <section class="composer" aria-label="Shorten a URL">
    <form id="shortenForm">
      <div class="input-row">
        <span class="prompt-glyph">&gt;</span>
        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/some/very/long/path?that=nobody&wants=to-type"
          autocomplete="off"
          required
        >
        <button type="submit" id="submitBtn">
          <span class="btn-label">Generate</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>

      <button type="button" id="toggleCustom" class="link-btn">+ custom code</button>

      <div class="custom-row" id="customRow" hidden>
        <span class="custom-prefix" id="customPrefix">yoursite/</span>
        <input type="text" id="customCode" placeholder="my-link" maxlength="20" autocomplete="off">
      </div>

      <p class="error-msg" id="errorMsg" hidden></p>
    </form>
  </section>

  <!-- Compression readout: hidden until a link has been shortened -->
  <section class="result" id="resultCard" hidden>
    <div class="compress-meter" aria-hidden="true">
      <div class="meter-row">
        <span class="meter-label">before</span>
        <div class="meter-track"><div class="meter-fill meter-fill--before" id="meterBefore"></div></div>
        <span class="meter-count" id="countBefore">0</span>
      </div>
      <div class="meter-row">
        <span class="meter-label">after</span>
        <div class="meter-track"><div class="meter-fill meter-fill--after" id="meterAfter"></div></div>
        <span class="meter-count" id="countAfter">0</span>
      </div>
      <p class="meter-ratio" id="meterRatio"></p>
    </div>

    <div class="result-card">
      <div class="result-line">
        <span class="result-label">short</span>
        <a href="#" id="shortLink" class="result-value result-value--link" target="_blank" rel="noopener"></a>
        <button class="icon-btn" id="copyBtn" title="Copy to clipboard">copy</button>
      </div>
      <div class="result-line result-line--dim">
        <span class="result-label">original</span>
        <span class="result-value" id="originalLink"></span>
      </div>
    </div>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>Recent links</h2>
      <button id="refreshBtn" class="link-btn">refresh</button>
    </div>
    <div class="table-wrap">
      <table id="historyTable">
        <thead>
          <tr>
            <th>code</th>
            <th>destination</th>
            <th>clicks</th>
            <th>created</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr class="empty-row"><td colspan="4">No links yet — shorten your first one above.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<footer class="wrap footer">
  <p>Flask · MongoDB · vanilla JS — a small backend project.</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
